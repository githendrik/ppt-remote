name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re-)release, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version
        id: v
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build (sanity check the tagged source compiles)
        env:
          PPTREMOTE_ARCHS: "arm64 x86_64"
          PPTREMOTE_VERSION: ${{ steps.v.outputs.version }}
        run: ./build.sh --no-install

      - name: Create source tarball
        id: tarball
        env:
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          NAME="ppt-remote-${VERSION}.tar.gz"
          # Own tarball rather than GitHub's generated one: the checksum is
          # then under our control and cannot be rewritten upstream.
          git archive --format=tar.gz \
            --prefix="ppt-remote-${VERSION}/" \
            -o "$NAME" "$TAG"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$NAME" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
          ASSET: ${{ steps.tarball.outputs.name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --title "$TAG" --generate-notes
          fi

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
          SHA256: ${{ steps.tarball.outputs.sha256 }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/githendrik/homebrew-tap.git" tap
          mkdir -p tap/Formula
          sed -e "s/@@VERSION@@/${VERSION}/g" \
              -e "s/@@SHA256@@/${SHA256}/g" \
              packaging/ppt-remote.rb.tmpl > tap/Formula/ppt-remote.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first: `git diff` alone ignores untracked files, so a
          # brand-new formula would look like "no change".
          git add Formula/ppt-remote.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date."
          else
            git commit -m "ppt-remote ${VERSION}"
            git push
          fi
