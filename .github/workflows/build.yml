name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build universal bundle
        env:
          PPTREMOTE_ARCHS: "arm64 x86_64"
          PPTREMOTE_VERSION: "0.0.0-ci"
        run: ./build.sh --no-install

      - name: Verify bundle
        run: |
          lipo -info PPTRemote.app/Contents/MacOS/PPTRemote
          codesign --verify --verbose PPTRemote.app
